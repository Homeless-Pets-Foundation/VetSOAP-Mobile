name: CodeQL

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 6am UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: "runs-on=${{ github.run_id }}-analyze-${{ strategy.job-index }}-${{ github.run_attempt }}/runner=linux-ci"
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true
          persist-credentials: false

      - name: Report and verify commit
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "git rev-parse HEAD=$checked_out_sha"
          test "$checked_out_sha" = "$GITHUB_SHA"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          trap-caching: false
          dependency-caching: false

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          upload: always
          upload-database: false
