name: Self-hosted CI

run-name: Self-hosted CI for ${{ github.ref_name }} at ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: self-hosted-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  confirm-pr-head:
    name: Confirm PR head
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      base-sha: ${{ steps.confirm.outputs.base-sha }}
      head-sha: ${{ steps.confirm.outputs.head-sha }}
      pr-number: ${{ steps.confirm.outputs.pr-number }}
    steps:
      - name: Confirm one open same-repository PR at the dispatch SHA
        id: confirm
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            if (process.env.GITHUB_REF_TYPE !== 'branch' || !context.ref.startsWith('refs/heads/')) {
              core.setFailed(`Dispatch must target a branch, not ${context.ref}.`);
              return;
            }

            const { owner, repo } = context.repo;
            const branch = context.ref.slice('refs/heads/'.length);
            const repository = `${owner}/${repo}`;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              per_page: 100,
            });
            const matching = pulls.filter((pull) =>
              pull.head.ref === branch && pull.head.repo?.full_name === repository
            );

            if (matching.length !== 1) {
              core.setFailed(
                `Expected exactly one open same-repository PR for ${branch}; found ${matching.length}.`,
              );
              return;
            }

            const pull = matching[0];
            const defaultBranch = context.payload.repository.default_branch;
            if (pull.base.ref !== defaultBranch) {
              core.setFailed(
                `PR #${pull.number} targets ${pull.base.ref}; expected ${defaultBranch}.`,
              );
              return;
            }
            if (pull.head.sha !== context.sha) {
              core.setFailed(
                `Dispatch SHA ${context.sha} is stale; PR #${pull.number} now points to ${pull.head.sha}.`,
              );
              return;
            }

            core.setOutput('base-sha', pull.base.sha);
            core.setOutput('head-sha', pull.head.sha);
            core.setOutput('pr-number', String(pull.number));
            core.summary
              .addHeading('Confirmed pull request head')
              .addTable([
                ['PR', 'Branch', 'Base SHA', 'Head SHA'],
                [`#${pull.number}`, branch, pull.base.sha, pull.head.sha],
              ]);
            await core.summary.write();

  r2-destination-contract:
    name: R2 Destination Contract
    needs: confirm-pr-head
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout confirmed PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.confirm-pr-head.outputs.head-sha }}
          clean: true
          persist-credentials: false
      - name: Report and verify commit
        env:
          CONFIRMED_SHA: ${{ needs.confirm-pr-head.outputs.head-sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "git rev-parse HEAD=$checked_out_sha"
          test "$GITHUB_SHA" = "$CONFIRMED_SHA"
          test "$checked_out_sha" = "$CONFIRMED_SHA"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Verify R2 contracts
        run: ./scripts/ci.sh r2

  typecheck:
    name: Typecheck
    needs: confirm-pr-head
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout confirmed PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.confirm-pr-head.outputs.head-sha }}
          clean: true
          persist-credentials: false
      - name: Report and verify commit
        env:
          CONFIRMED_SHA: ${{ needs.confirm-pr-head.outputs.head-sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "git rev-parse HEAD=$checked_out_sha"
          test "$GITHUB_SHA" = "$CONFIRMED_SHA"
          test "$checked_out_sha" = "$CONFIRMED_SHA"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: ./scripts/ci.sh typecheck

  lint:
    name: Lint
    needs: confirm-pr-head
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout confirmed PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.confirm-pr-head.outputs.head-sha }}
          clean: true
          persist-credentials: false
      - name: Report and verify commit
        env:
          CONFIRMED_SHA: ${{ needs.confirm-pr-head.outputs.head-sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "git rev-parse HEAD=$checked_out_sha"
          test "$GITHUB_SHA" = "$CONFIRMED_SHA"
          test "$checked_out_sha" = "$CONFIRMED_SHA"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: ./scripts/ci.sh lint

  test:
    name: Test
    needs: confirm-pr-head
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout confirmed PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.confirm-pr-head.outputs.head-sha }}
          clean: true
          persist-credentials: false
      - name: Report and verify commit
        env:
          CONFIRMED_SHA: ${{ needs.confirm-pr-head.outputs.head-sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "git rev-parse HEAD=$checked_out_sha"
          test "$GITHUB_SHA" = "$CONFIRMED_SHA"
          test "$checked_out_sha" = "$CONFIRMED_SHA"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: ./scripts/ci.sh test

  expo-deps:
    name: Expo SDK deps
    needs: confirm-pr-head
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout confirmed PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.confirm-pr-head.outputs.head-sha }}
          clean: true
          persist-credentials: false
      - name: Report and verify commit
        env:
          CONFIRMED_SHA: ${{ needs.confirm-pr-head.outputs.head-sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "git rev-parse HEAD=$checked_out_sha"
          test "$GITHUB_SHA" = "$CONFIRMED_SHA"
          test "$checked_out_sha" = "$CONFIRMED_SHA"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Check installed versions against the Expo SDK
        run: ./scripts/ci.sh expo-deps

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: confirm-pr-head
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout confirmed PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.confirm-pr-head.outputs.head-sha }}
          clean: true
          persist-credentials: false
      - name: Report and verify commit
        env:
          CONFIRMED_SHA: ${{ needs.confirm-pr-head.outputs.head-sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "git rev-parse HEAD=$checked_out_sha"
          test "$GITHUB_SHA" = "$CONFIRMED_SHA"
          test "$checked_out_sha" = "$CONFIRMED_SHA"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          trap-caching: false
          dependency-caching: false
      - name: Autobuild
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
          upload: always
          upload-database: false

  dependency-review:
    name: Review
    needs: confirm-pr-head
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout confirmed PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.confirm-pr-head.outputs.head-sha }}
          clean: true
          persist-credentials: false
      - name: Report and verify commit
        env:
          CONFIRMED_SHA: ${{ needs.confirm-pr-head.outputs.head-sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "git rev-parse HEAD=$checked_out_sha"
          test "$GITHUB_SHA" = "$CONFIRMED_SHA"
          test "$checked_out_sha" = "$CONFIRMED_SHA"
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          base-ref: ${{ needs.confirm-pr-head.outputs.base-sha }}
          head-ref: ${{ needs.confirm-pr-head.outputs.head-sha }}
          fail-on-severity: high

  swift-typecheck:
    name: Swift typecheck (durable recorder)
    needs: confirm-pr-head
    runs-on: [self-hosted, local-ci, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - name: Checkout confirmed PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.confirm-pr-head.outputs.head-sha }}
          clean: true
          persist-credentials: false
      - name: Report and verify commit
        env:
          CONFIRMED_SHA: ${{ needs.confirm-pr-head.outputs.head-sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "git rev-parse HEAD=$checked_out_sha"
          test "$GITHUB_SHA" = "$CONFIRMED_SHA"
          test "$checked_out_sha" = "$CONFIRMED_SHA"
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun swiftc --version
      - name: Type-check ExpoModulesCore-free Swift
        run: ./scripts/ci.sh swift

  audit-ios-simulator:
    name: Audit unsigned iOS simulator build (verification only)
    needs: confirm-pr-head
    runs-on: [self-hosted, local-ci, macOS, ARM64]
    timeout-minutes: 75
    env:
      APP_VARIANT: local-test
      NODE_ENV: production
      CI: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      EXPO_PUBLIC_API_URL: https://fixture.invalid
      EXPO_PUBLIC_SUPABASE_URL: https://fixture.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: synthetic-local-only
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: synthetic-captivet-audit.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: synthetic-captivet-audit.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_IOS_URL_SCHEME: com.googleusercontent.apps.synthetic-captivet-audit
    steps:
      - name: Checkout confirmed verification head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.confirm-pr-head.outputs.head-sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build current product for the simulator without signing
        env:
          CONFIRMED_SHA: ${{ needs.confirm-pr-head.outputs.head-sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONFIRMED_SHA"
          git diff --exit-code 70095f9951c5e5686106c4d44634d55c255836b7 -- app src modules plugins assets package.json package-lock.json app.config.ts
          build_dir="$(mktemp -d "$RUNNER_TEMP/captivet-audit-ios.XXXXXX")"
          echo "AUDIT_IOS_DIR=$build_dir" >> "$GITHUB_ENV"
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 20971520
          xcodebuild -version
          pod --version
          npm ci --include=dev
          npx expo prebuild --platform ios --no-install 2>&1 | tee "$build_dir/prebuild.log"
          (cd ios && pod install) 2>&1 | tee "$build_dir/pods.log"
          grep -F 'RNDateTimePicker (8.6.0)' ios/Podfile.lock
          cp ios/Podfile.lock "$build_dir/Podfile.lock"
          workspaces=(ios/*.xcworkspace)
          test "${#workspaces[@]}" -eq 1
          workspace="${workspaces[0]}"
          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild -list -workspace "$workspace" -json > "$build_dir/schemes.json"
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$build_dir/DerivedData" -jobs 4 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee "$build_dir/build.log"
          apps=("$build_dir/DerivedData/Build/Products/Release-iphonesimulator/"*.app)
          test "${#apps[@]}" -eq 1
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "${apps[0]}/Info.plist")" = com.captivet.mobile.local
          tar -czf "$build_dir/captivet-audit-ios-simulator.tar.gz" -C "$(dirname "${apps[0]}")" "$(basename "${apps[0]}")"
          shasum -a 256 "$build_dir/captivet-audit-ios-simulator.tar.gz" > "$build_dir/artifact.sha256"
      - name: Save simulator application and build evidence
        if: always() && env.AUDIT_IOS_DIR != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captivet-audit-ios-simulator
          path: |
            ${{ env.AUDIT_IOS_DIR }}/*.log
            ${{ env.AUDIT_IOS_DIR }}/*.json
            ${{ env.AUDIT_IOS_DIR }}/*.tar.gz
            ${{ env.AUDIT_IOS_DIR }}/artifact.sha256
            ${{ env.AUDIT_IOS_DIR }}/Podfile.lock
          retention-days: 7
      - name: Remove only this build's derived data
        if: always() && env.AUDIT_IOS_DIR != ''
        shell: bash
        run: rm -rf "$AUDIT_IOS_DIR/DerivedData"
